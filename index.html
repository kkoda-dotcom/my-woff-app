<button id="btn" style="padding: 20px; font-size: 20px;">出席しました！</button>

<script>
  woff.init({ woffId: "d6J0bpN1tDgKxe7LyocP8Q" }).then(() => {
    document.getElementById('btn').addEventListener('click', () => {
      // ユーザー情報を取得
      woff.getProfile().then(profile => {
        // GASにデータを送信
        fetch('あなたのGASのURL', {
          method: 'POST',
          body: JSON.stringify({ name: profile.displayName })
        })
        .then(() => {
          alert('記録しました！');
          woff.closeWindow(); // 終わったら画面を閉じる
        });
      });
    });
  });

</script>
