<h2 id="welcome">診断中...</h2>
<p id="debug" style="color:red; font-size:12px;"></p>

<script src="https://static.worksmobile.net/static/wm/woff/edge/3.0.0/woff.js"></script>
<script>
  window.onload = function() {
    woff.init({ woffId: "d6J0bpN1tDgKxe7LyocP8Q" })
      .then(() => {
        return woff.getProfile();
      })
      .then(profile => {
        document.getElementById('welcome').innerText = profile.displayName + "さん 成功！";
      })
      .catch(err => {
        // エラー内容を画面に表示する
        document.getElementById('welcome').innerText = "エラー発生";
        document.getElementById('debug').innerText = "内容: " + JSON.stringify(err);
      });
  };
</script>
